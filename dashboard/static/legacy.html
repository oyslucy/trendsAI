<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>consumer-signal · 검증 대시보드</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-elevated: #11151f;
    --bg-hover: #171c29;
    --border: #232838;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #5b8cff;
    --lead: #35c98f;
    --react: #ffb454;
    --neg: #ff5f6d;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }

  select, button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 13px;
  }

  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }

  nav.tabs {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  nav.tabs button {
    border: none;
    border-radius: 6px 6px 0 0;
    background: transparent;
    color: var(--text-dim);
  }

  nav.tabs button.active {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--bg);
  }

  main {
    padding: 20px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .empty-state {
    color: var(--text-dim);
    padding: 40px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  section.panel {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  section.panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: left;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 12px;
    position: sticky;
    top: 0;
    background: var(--bg-elevated);
  }

  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr.selected { background: var(--bg-hover); outline: 1px solid var(--accent); }

  .mono { font-family: var(--mono); }
  .dim { color: var(--text-dim); }
  .no-signal { color: var(--text-dim); font-style: italic; }

  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: var(--mono);
  }
  .badge.lead { background: rgba(53, 201, 143, 0.15); color: var(--lead); }
  .badge.react { background: rgba(255, 180, 84, 0.15); color: var(--react); }
  .badge.sent-1 { background: rgba(255, 95, 109, 0.15); color: var(--neg); }
  .badge.sent0 { background: rgba(139, 147, 167, 0.15); color: var(--text-dim); }
  .badge.sent1 { background: rgba(53, 201, 143, 0.15); color: var(--lead); }

  #sparkline-panel {
    padding: 14px;
    display: none;
  }
  #sparkline-panel.visible { display: block; }
  #sparkline-panel h3 { margin: 0 0 8px; font-size: 13px; }
  #sparkline-panel .charts { display: flex; gap: 20px; flex-wrap: wrap; }
  #sparkline-panel canvas {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #sparkline-panel figcaption { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  #network-wrap { position: relative; }
  #network-canvas {
    width: 100%;
    height: 70vh;
    display: block;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12px;
    display: none;
    z-index: 10;
  }

  #drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-elevated);
    border-left: 1px solid var(--border);
    padding: 16px;
    transform: translateX(100%);
    transition: transform 0.15s ease;
    overflow-y: auto;
  }
  #drawer.open { transform: translateX(0); }
  #drawer dt { color: var(--text-dim); font-size: 11px; margin-top: 8px; }
  #drawer dd { margin: 2px 0 0; font-family: var(--mono); }

  @media (prefers-reduced-motion: reduce) {
    #drawer { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1>consumer-signal · 검증 대시보드</h1>
  <select id="date-select"></select>
  <nav class="tabs">
    <button data-tab="signals" class="active">Signals</button>
    <button data-tab="network">Network</button>
  </nav>
</header>

<main>
  <div id="empty" class="empty-state" style="display:none;"></div>

  <div id="tab-signals" class="tab-panel active">
    <section class="panel">
      <h2>Keywords (z 내림차순)</h2>
      <table id="keyword-table">
        <thead>
          <tr>
            <th>키워드</th><th>브랜드</th><th>z</th><th>sentiment</th>
            <th>direct</th><th>proxy</th><th>no_signal</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="sparkline-panel">
        <h3 id="sparkline-title"></h3>
        <div class="charts">
          <figure>
            <canvas id="chart-raw" width="360" height="90"></canvas>
            <figcaption>raw ratio (트레일링)</figcaption>
          </figure>
          <figure>
            <canvas id="chart-z" width="360" height="90"></canvas>
            <figcaption>z-score (±5σ winsorized)</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Stocks (agg 내림차순)</h2>
      <table id="stock-table">
        <thead>
          <tr>
            <th>티커</th><th>종목명</th><th>섹터</th><th>agg</th><th>거래량 z</th><th>status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <div id="tab-network" class="tab-panel">
    <div id="network-wrap">
      <canvas id="network-canvas"></canvas>
      <div id="tooltip"></div>
      <div id="drawer"></div>
    </div>
  </div>
</main>

<script>
"use strict";

const state = { snapshot: null, series: {}, sim: null };

function fmt(n, digits = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "–";
  return Number(n).toFixed(digits);
}

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (resp.status === 404) return null;
  return resp.json();
}

function showEmpty(message) {
  document.getElementById("empty").style.display = "block";
  document.getElementById("empty").textContent = message;
  document.getElementById("tab-signals").style.display = "none";
  document.getElementById("tab-network").style.display = "none";
}

function hideEmpty() {
  document.getElementById("empty").style.display = "none";
  document.getElementById("tab-signals").style.display = "";
  document.getElementById("tab-network").style.display = "";
}

async function loadDate(date) {
  const [snapshot, series] = await Promise.all([
    fetchJSON(`/api/snapshot/${date}`),
    fetchJSON(`/api/series/${date}`),
  ]);
  if (!snapshot || snapshot.nodes.length === 0) {
    showEmpty(snapshot ? `${date} 스냅샷이 비어 있습니다.` : `${date} 스냅샷이 없습니다.`);
    return;
  }
  hideEmpty();
  state.snapshot = snapshot;
  state.series = series || {};
  renderSignals();
  renderNetwork();
}

// ---------- Signals tab ----------

function isNoSignal(keyword) {
  const s = state.series[keyword];
  if (!s || !s.raw || s.raw.length === 0) return true;
  return s.raw.every((v) => v === 0);
}

function renderSignals() {
  const { nodes, links } = state.snapshot;
  const keywordNodes = nodes.filter((n) => n.type === "keyword").sort((a, b) => (b.z ?? 0) - (a.z ?? 0));

  const linksByKeyword = {};
  for (const l of links) {
    if (l.kind === "direct" || l.kind === "proxy") {
      (linksByKeyword[l.source] ??= { direct: [], proxy: [] })[l.kind].push(l.target);
    }
  }

  const kwBody = document.querySelector("#keyword-table tbody");
  kwBody.innerHTML = "";
  for (const n of keywordNodes) {
    const noSignal = isNoSignal(n.id);
    const mapped = linksByKeyword[n.id] || { direct: [], proxy: [] };
    const tr = document.createElement("tr");
    tr.dataset.keyword = n.id;
    tr.innerHTML = `
      <td>${n.label}</td>
      <td class="dim">${n.why ?? ""}</td>
      <td class="mono">${fmt(n.z)}</td>
      <td><span class="badge sent${n.sentiment ?? 0}">${n.sentiment ?? 0}</span></td>
      <td class="mono dim">${mapped.direct.join(", ") || "–"}</td>
      <td class="mono dim">${mapped.proxy.join(", ") || "–"}</td>
      <td>${noSignal ? '<span class="no-signal">no_signal</span>' : ""}</td>
    `;
    tr.addEventListener("click", () => selectKeyword(n, tr));
    kwBody.appendChild(tr);
  }

  const stockNodes = nodes.filter((n) => n.type === "stock").sort((a, b) => (b.agg ?? 0) - (a.agg ?? 0));
  const stBody = document.querySelector("#stock-table tbody");
  stBody.innerHTML = "";
  for (const n of stockNodes) {
    const tr = document.createElement("tr");
    const badge = n.status ? `<span class="badge ${n.status}">${n.status}</span>` : "";
    tr.innerHTML = `
      <td class="mono">${n.ticker}</td>
      <td>${n.label}</td>
      <td class="dim">${n.sector ?? ""}</td>
      <td class="mono">${fmt(n.agg)}</td>
      <td class="mono">${fmt(n.volume_z)}</td>
      <td>${badge}</td>
    `;
    stBody.appendChild(tr);
  }
}

function selectKeyword(node, tr) {
  document.querySelectorAll("#keyword-table tbody tr").forEach((r) => r.classList.remove("selected"));
  tr.classList.add("selected");
  const panel = document.getElementById("sparkline-panel");
  panel.classList.add("visible");
  document.getElementById("sparkline-title").textContent = node.label;

  const s = state.series[node.id];
  drawSparkline(document.getElementById("chart-raw"), s ? s.raw : [], "#5b8cff");
  drawSparkline(document.getElementById("chart-z"), s ? s.z : [], "#35c98f", true);
}

function drawSparkline(canvas, values, color, showThreshold = false) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!values || values.length === 0) return;

  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const span = max - min || 1;
  const pad = 8;
  const x = (i) => pad + (i / (values.length - 1 || 1)) * (w - 2 * pad);
  const y = (v) => h - pad - ((v - min) / span) * (h - 2 * pad);

  if (showThreshold) {
    ctx.strokeStyle = "rgba(255,180,84,0.4)";
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(pad, y(2.0));
    ctx.lineTo(w - pad, y(2.0));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  values.forEach((v, i) => (i === 0 ? ctx.moveTo(x(i), y(v)) : ctx.lineTo(x(i), y(v))));
  ctx.stroke();
}

// ---------- Network tab ----------

function renderNetwork() {
  const canvas = document.getElementById("network-canvas");
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;

  const colorByType = { keyword: "#5b8cff", sector: "#8b93a7", stock: "#35c98f" };
  const nodes = state.snapshot.nodes.map((n) => ({
    ...n,
    x: Math.random() * rect.width,
    y: Math.random() * rect.height,
    vx: 0,
    vy: 0,
  }));
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const edges = state.snapshot.links
    .filter((l) => byId[l.source] && byId[l.target])
    .map((l) => ({ ...l, a: byId[l.source], b: byId[l.target] }));

  if (state.sim) cancelAnimationFrame(state.sim);

  function tick() {
    const W = rect.width, H = rect.height;
    for (const n of nodes) {
      let fx = (W / 2 - n.x) * 0.002;
      let fy = (H / 2 - n.y) * 0.002;
      for (const other of nodes) {
        if (other === n) continue;
        const dx = n.x - other.x, dy = n.y - other.y;
        const d2 = Math.max(dx * dx + dy * dy, 25);
        const f = 600 / d2;
        fx += (dx / Math.sqrt(d2)) * f;
        fy += (dy / Math.sqrt(d2)) * f;
      }
      n.vx = (n.vx + fx) * 0.85;
      n.vy = (n.vy + fy) * 0.85;
    }
    for (const e of edges) {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = 90;
      const f = (dist - target) * 0.01;
      const fx = (dx / dist) * f, fy = (dy / dist) * f;
      e.a.vx += fx; e.a.vy += fy;
      e.b.vx -= fx; e.b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.dragging) continue;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(10, Math.min(W - 10, n.x));
      n.y = Math.max(10, Math.min(H - 10, n.y));
    }
    draw();
    state.sim = requestAnimationFrame(tick);
  }

  const ctx = canvas.getContext("2d");
  function draw() {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.strokeStyle = "rgba(139,147,167,0.25)";
    ctx.lineWidth = 1;
    for (const e of edges) {
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
      ctx.stroke();
    }
    for (const n of nodes) {
      const r = n.type === "keyword" ? 5 : n.type === "stock" ? 6 : 4;
      ctx.fillStyle = colorByType[n.type] || "#e6e9f0";
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fill();
      if (n.type !== "sector") {
        ctx.fillStyle = "rgba(230,233,240,0.7)";
        ctx.font = "10px var(--sans)";
        ctx.fillText(n.label, n.x + r + 3, n.y + 3);
      }
    }
  }

  const tooltip = document.getElementById("tooltip");
  const drawer = document.getElementById("drawer");

  function nodeAt(px, py) {
    return nodes.find((n) => Math.hypot(n.x - px, n.y - py) < 10);
  }

  let dragTarget = null;

  canvas.onmousemove = (ev) => {
    const px = ev.offsetX, py = ev.offsetY;
    if (dragTarget) {
      dragTarget.x = px; dragTarget.y = py;
      return;
    }
    const n = nodeAt(px, py);
    if (n) {
      tooltip.style.display = "block";
      tooltip.style.left = px + 14 + "px";
      tooltip.style.top = py + 14 + "px";
      tooltip.textContent = `${n.label} (${n.type})`;
      canvas.style.cursor = "pointer";
    } else {
      tooltip.style.display = "none";
      canvas.style.cursor = "default";
    }
  };
  canvas.onmousedown = (ev) => {
    const n = nodeAt(ev.offsetX, ev.offsetY);
    if (n) { n.dragging = true; dragTarget = n; }
  };
  window.addEventListener("mouseup", () => {
    if (dragTarget) dragTarget.dragging = false;
    dragTarget = null;
  });
  canvas.onclick = (ev) => {
    const n = nodeAt(ev.offsetX, ev.offsetY);
    if (!n) { drawer.classList.remove("open"); return; }
    drawer.innerHTML = `
      <h3>${n.label}</h3>
      <dl>
        <dt>type</dt><dd>${n.type}</dd>
        ${n.z !== undefined && n.z !== null ? `<dt>z</dt><dd>${fmt(n.z)}</dd>` : ""}
        ${n.sentiment !== undefined && n.sentiment !== null ? `<dt>sentiment</dt><dd>${n.sentiment}</dd>` : ""}
        ${n.why ? `<dt>why</dt><dd>${n.why}</dd>` : ""}
        ${n.ticker ? `<dt>ticker</dt><dd>${n.ticker}</dd>` : ""}
        ${n.sector ? `<dt>sector</dt><dd>${n.sector}</dd>` : ""}
        ${n.agg !== undefined && n.agg !== null ? `<dt>agg</dt><dd>${fmt(n.agg)}</dd>` : ""}
        ${n.volume_z !== undefined && n.volume_z !== null ? `<dt>volume_z</dt><dd>${fmt(n.volume_z)}</dd>` : ""}
        ${n.status ? `<dt>status</dt><dd>${n.status}</dd>` : ""}
      </dl>
    `;
    drawer.classList.add("open");
  };

  tick();
}

// ---------- tabs & bootstrap ----------

document.querySelectorAll("nav.tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
  });
});

(async function bootstrap() {
  const dates = await fetchJSON("/api/dates");
  const select = document.getElementById("date-select");
  if (!dates || dates.length === 0) {
    showEmpty("data/snapshot_*.json이 없습니다. 먼저 `make run`으로 파이프라인을 실행하세요.");
    return;
  }
  for (const d of dates) {
    const opt = document.createElement("option");
    opt.value = d; opt.textContent = d;
    select.appendChild(opt);
  }
  select.value = dates[dates.length - 1];
  select.addEventListener("change", () => loadDate(select.value));
  loadDate(select.value);
})();
</script>
</body>
</html>
