# keyword_map.yaml — 검색 키워드 → 종목 매핑 시드 (20~30행)
#
# 스키마 (dictionary/loader.py::KeywordEntry):
#   keyword: str        # 구글 트렌드에 조회할 검색어
#   brand:   str         # 대표 브랜드명
#   sector:  str          # universe.csv의 sector와 정렬
#   direct:  [ticker...]  # 검색어가 곧 이 종목의 매출로 직결되는 티커
#   proxy:   [ticker...]  # 간접/유사 수혜가 예상되는 티커 (direct보다 약한 연결)
#   weight:  float        # 신호 집계 시 가중치 (기본 1.0)
#
# 아래는 시드 데이터. 나머지 종목/키워드는 사람이 리서치 후 이어서 채운다.
