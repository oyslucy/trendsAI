# keyword_map.yaml — 검색 키워드 → 브랜드 → 상장사 매핑 시드
#
# 스키마 (dictionary/loader.py::KeywordEntry):
#   product:           str   # 실제로 검색되는 제품/SKU 레벨 표현 (구글 트렌드 조회어)
#   brand:             str   # 브랜드명 — 상장사 사명과 다를 수 있음(예: 메디큐브 ≠ 에이피알)
#   sector:            str   # universe.csv의 sector와 정렬
#   direct:            [ticker...]  # 검색어가 곧 이 종목의 매출로 직결되는 티커
#   proxy:             [ticker...]  # 간접/유사 수혜가 예상되는 티커 (direct보다 약한 연결)
#   aliases:           [str...]     # 동의어/변형어. 구글 트렌드 term에 OR(+)로 결합
#   geo_keywords:      {geo: [str...]}  # geo별 검색어 override. 없으면 aliases→product 순 fallback
#   product_to_brand:  float  # 제품이 브랜드 매출에서 차지하는 비중 근사치 (기본 1.0 = 미리서치)
#   brand_to_company:  float  # 브랜드가 상장사 전사 매출에서 차지하는 비중 근사치 (기본 1.0 = 미리서치)
#   ownership:         direct | equity_method | distribution
#
# 가중치 원칙: product_to_brand × brand_to_company가 신호 집계 가중치(KeywordEntry.weight)다.
# 기본값 1.0/1.0은 "사업보고서 기준 리서치 전"이라는 뜻이지 실제 비중이 100%라는 뜻이 아니다.
# 다중 브랜드/사업부 보유 기업(CJ제일제당·하이트진로·LG생활건강 등)은 매출 비중을
# 사람이 사업보고서·IR 자료로 리서치해서 brand_to_company를 채워야 정확해진다.
#
# 키워드 원칙: generic 트렌드어("○○ 신상", "○○ 인기템") 금지 — 실제로 검색되는
# 표현만. 히어로 SKU·신제품·성분 키워드 위주로 채운다.
#
# TODO(human):
#   - GS리테일(007070)·BGF리테일(282330)에 매핑된 키워드 없음. 편의점 PB 바이럴
#     상품은 월 단위로 바뀌므로 현재 트렌드 상품으로 채워야 한다(추측으로 채우지 않음).
#   - product_to_brand / brand_to_company는 대부분 기본값(1.0)이다. 다중 브랜드
#     보유 기업 위주로 사업보고서 부문별 매출 비중을 리서치해 채울 것.
#   - geo_keywords는 아직 비어있다(P1: 해외 geo 수집 붙을 때 채움).

